<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Detector</title>
<style>
:root{
  --bg:#f2f3fa; --surface:rgba(255,255,255,.82); --ink:#171a2e; --muted:#69708c; --line:rgba(23,26,46,.1);
  --accent:#6c7bff; --font:"Segoe UI",system-ui,-apple-system,Roboto,"Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f111c; --surface:rgba(28,31,48,.82); --ink:#eef0fc; --muted:#9ba2c0; --line:rgba(255,255,255,.09)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--ink);overflow-x:hidden;position:relative}
/* colour aurora that follows the detected emotion */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;background:var(--accent);transition:background 1s}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax}
.aurora i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;bottom:-12vmax;opacity:.3}
.rain{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.rain span{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:0}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
main{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:40px 18px 60px}
header{text-align:center;margin-bottom:28px}
h1{font-size:clamp(1.9rem,5vw,3rem);letter-spacing:-.03em;margin:0 0 8px}
header p{margin:0;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border:1px solid var(--line);
  border-radius:999px;font-size:.82rem;color:var(--muted);background:var(--surface);backdrop-filter:blur(8px)}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.ok{background:#2fb86b;box-shadow:0 0 0 4px rgba(47,184,107,.2)}.dot.bad{background:#e5484d}
.card{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 50px -25px rgba(20,20,60,.35)}
/* stage */
.stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 22px}
.big{font-size:clamp(5rem,18vw,8rem);line-height:1;filter:drop-shadow(0 12px 24px color-mix(in srgb,var(--accent) 45%,transparent))}
.big.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.big.idle{animation:float 3.4s ease-in-out infinite}
@keyframes pop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
.label{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;text-transform:capitalize;margin-top:10px}
.sub{color:var(--muted);margin-top:4px;min-height:1.4em}
textarea{width:100%;min-height:120px;resize:vertical;padding:16px;border-radius:16px;font:inherit;font-size:1.05rem;line-height:1.5;
  color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line)}
textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin:8px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chip:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.go{width:100%;padding:15px;border:0;border-radius:16px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;transition:background .8s,transform .1s,opacity .2s}
.go:active{transform:scale(.99)}.go:disabled{opacity:.5;cursor:not-allowed}
.chip:focus-visible,.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bars{margin-top:22px;display:none}.bars.show{display:block}
.bar{display:grid;grid-template-columns:128px 1fr 54px;align-items:center;gap:12px;margin:11px 0;font-size:.95rem}
.bar .t{height:12px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.bar .f{height:100%;width:0;border-radius:99px;background:var(--c);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar.top{font-weight:700}
.hist{margin-top:24px;display:none}.hist.show{display:block}
.hist h2{font-size:1rem;margin:0 0 10px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item .e{font-size:1.6rem}.item .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .c{color:var(--muted);font-size:.85rem;white-space:nowrap}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;color:#e5484d;background:rgba(229,72,77,.12);display:none}
@media (max-width:520px){.bar{grid-template-columns:104px 1fr 48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i></div>
<div class="rain" id="rain" aria-hidden="true"></div>

<main>
  <header>
    <h1>Emotion Detector</h1>
    <p>Write a sentence and let the BiGRU model read the feeling behind it.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="st">Checking server…</span></div>
  </header>

  <section class="card">
    <div class="stage" aria-live="polite">
      <div class="big idle" id="big">🙂</div>
      <div class="label" id="label">Waiting for a sentence</div>
      <div class="sub" id="sub">Try one of the examples below</div>
    </div>

    <textarea id="text" maxlength="2000" placeholder="I feel so happy and excited…"></textarea>
    <div class="row"><span>Ctrl + Enter to analyze</span><span id="count">0 / 2000</span></div>
    <div class="chips" id="chips"></div>
    <button class="go" id="go" disabled>Analyze emotion</button>
    <div class="err" id="err" role="alert"></div>

    <div class="bars" id="bars"></div>
  </section>

  <section class="card hist" id="hist" style="margin-top:20px">
    <h2>Recent analyses</h2><div id="list"></div>
  </section>
</main>

<script>
const E = {
  sadness:{e:"😢",c:"#4f7cff"}, joy:{e:"😄",c:"#f5a524"}, love:{e:"❤️",c:"#ec4f8f"},
  anger:{e:"😠",c:"#e5484d"}, fear:{e:"😨",c:"#8e5cf0"}, surprise:{e:"😲",c:"#12a594"}
};
const EXAMPLES = [
  "I feel so happy and excited today",
  "I can't stop crying, everything is falling apart",
  "I am furious about how they treated me",
  "I'm terrified of what might happen tomorrow",
  "I adore spending time with you",
  "I never expected this to happen!"
];
const $ = id => document.getElementById(id);
const text=$("text"), go=$("go");
let healthy=false;

EXAMPLES.forEach(s=>{
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.textContent=s;
  b.onclick=()=>{text.value=s; refresh(); analyze();};
  $("chips").appendChild(b);
});

function refresh(){
  $("count").textContent=text.value.length+" / 2000";
  go.disabled=!healthy||!text.value.trim();
}
text.addEventListener("input",refresh);
text.addEventListener("keydown",e=>{if(e.ctrlKey&&e.key==="Enter")analyze()});
go.addEventListener("click",analyze);

async function health(){
  try{
    const d=await (await fetch("/health")).json();
    healthy=!!d.model_loaded;
    $("dot").className="dot "+(healthy?"ok":"bad");
    $("st").textContent=healthy?"Model ready":"Model not loaded";
  }catch{
    healthy=false; $("dot").className="dot bad"; $("st").textContent="Server unreachable";
  }
  refresh();
}

function showErr(m){const x=$("err");x.textContent=m;x.style.display=m?"block":"none"}

async function analyze(){
  const v=text.value.trim();
  if(!v||!healthy)return;
  showErr(""); go.disabled=true; go.textContent="Analyzing…";
  try{
    const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:v})});
    if(!r.ok){
      const j=await r.json().catch(()=>({}));
      throw new Error(typeof j.detail==="string"?j.detail:"The server could not analyze this text. Check the sentence and try again.");
    }
    show(await r.json(), v);
  }catch(e){ showErr(e.message||"Could not reach the server.") }
  finally{ go.textContent="Analyze emotion"; refresh() }
}

function show(d, original){
  const top=d.predicted_emotion||d.prediction_emotion;
  const m=E[top]||{e:"🤔",c:"#6c7bff"};
  document.documentElement.style.setProperty("--accent",m.c);

  const big=$("big"); big.className="big"; void big.offsetWidth; big.className="big pop";
  big.textContent=m.e;
  $("label").textContent=top;
  $("sub").textContent=(d.confidence*100).toFixed(1)+"% confident";

  const probs=d.all_probabilites||{};
  $("bars").className="bars show";
  $("bars").innerHTML=Object.entries(probs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar ${k===top?"top":""}" style="--c:${(E[k]||m).c}">
      <span>${(E[k]||{}).e||""} ${k}</span>
      <div class="t"><div class="f" data-w="${(v*100).toFixed(1)}"></div></div>
      <span class="p">${(v*100).toFixed(1)}%</span>
    </div>`).join("");
  requestAnimationFrame(()=>requestAnimationFrame(()=>
    document.querySelectorAll(".f").forEach(f=>f.style.width=f.dataset.w+"%")));

  rain(m.e);
  addHistory(m.e, original, d.confidence);
}

function rain(emoji){
  const box=$("rain");
  for(let i=0;i<14;i++){
    const s=document.createElement("span");
    s.textContent=emoji;
    s.style.left=Math.random()*100+"%";
    s.style.fontSize=(18+Math.random()*28)+"px";
    s.style.animationDuration=(3+Math.random()*3)+"s";
    s.style.animationDelay=(Math.random()*.8)+"s";
    box.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
}

const history=[];
function addHistory(e,t,c){
  history.unshift({e,t,c});
  if(history.length>5)history.pop();
  $("hist").className="card hist show";
  $("list").innerHTML="";
  history.forEach(h=>{
    const row=document.createElement("div"); row.className="item";
    const a=document.createElement("span"); a.className="e"; a.textContent=h.e;
    const b=document.createElement("span"); b.className="tx"; b.textContent=h.t;
    const d=document.createElement("span"); d.className="c"; d.textContent=(h.c*100).toFixed(0)+"%";
    row.append(a,b,d); $("list").appendChild(row);
  });
}

health(); setInterval(health,15000); refresh();
</script>
</body>
</html>
